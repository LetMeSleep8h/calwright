[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calwright"
version = "1.0.0"
description = "CSV to ICS calendar converter and validator. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amir Hussain" }]
keywords = ["csv", "ics", "icalendar", "calendar", "converter", "rfc5545"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Processing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aamirtechs/calwright"
Issues = "https://github.com/aamirtechs/calwright/issues"

[project.scripts]
calwright = "calwright.cli:main"

[tool.setuptools.packages.find]
include = ["calwright"]
